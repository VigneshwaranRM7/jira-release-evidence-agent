version: '3.8'

services:
  jira-evidence-agent:
    build: .
    container_name: jira-evidence-agent
    ports:
      - "8000:8000"
    environment:
      - PROJECT_KEY=REL
      - DATASET_LABEL=tyn-release-assessment-v2
      - TARGET_RELEASE=R2.4
      - TARGET_COMMIT=b7a91f2
      - TARGET_PROMPT=p7
      - TARGET_SERVICE=atlas-assistant
      - TARGET_ENV=production
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    restart: unless-stopped

